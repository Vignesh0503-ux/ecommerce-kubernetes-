apiVersion: batch/v1
kind: CronJob
metadata:
  name: ecommerce-test-cronjob
  namespace: ecommerce
spec:
  schedule: "*/2 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: cronjob
              image: busybox:1.36
              command:
                - sh
                - -c
                - echo "E-commerce CronJob executed at $(date)"
      backoffLimit: 2
